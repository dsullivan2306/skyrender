<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyrender — plane, robot, train, rocket, truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #cfd6d9; --ink: #22262a; --muted: #5f676d; --accent: #7a2430; --btn-bg: rgba(255,255,255,.4); --bar-bg: rgba(236,241,243,.85);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1a1e22; --ink: #e2e5e7; --muted: #8b949a; --accent: #d0606c; --btn-bg: rgba(0,0,0,.3); --bar-bg: rgba(20,24,28,.8); }
  }
  :root[data-theme="dark"] { --bg: #1a1e22; --ink: #e2e5e7; --muted: #8b949a; --accent: #d0606c; --btn-bg: rgba(0,0,0,.3); --bar-bg: rgba(20,24,28,.8); }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Karla", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .bar { background: linear-gradient(to top, var(--bar-bg) 0%, var(--bar-bg) 62%, transparent 100%); position: fixed; left: 0; right: 0; bottom: 0; padding: 20px 24px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; pointer-events: none; }
  .name { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .step { font-size: .95rem; color: var(--muted); margin: 4px 0 0; min-height: 1.2em; max-width: 36ch; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; pointer-events: auto; }
  button { font: 600 1rem/1 "Karla", "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--btn-bg);
    border: 1.5px solid var(--ink); border-radius: 999px; padding: 14px 22px; cursor: pointer; backdrop-filter: blur(6px); transition: background .2s, color .2s; }
  button:hover, button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; }
  #countdown { position: fixed; left: 0; right: 0; top: 18%; text-align: center; pointer-events: none;
    font: 600 clamp(3rem, 14vw, 7rem)/1 "Karla", "Helvetica Neue", Arial, sans-serif; color: #fff;
    text-shadow: 0 2px 18px rgba(0,0,0,.45); letter-spacing: -0.02em; }
  label.scrub { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  input[type=range] { width: min(220px, 40vw); accent-color: var(--accent); }
  @media (max-width: 560px) { .name { font-size: 1.25rem; } button { padding: 12px 16px; } }
  .side { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 2; }
  #acts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #acts button { padding: 7px 13px; font-size: .84rem; }
  .side { max-height: calc(100vh - 150px); overflow-y: auto; scrollbar-width: none; }
  .seg { display: flex; gap: 6px; }
  .side button { padding: 10px 16px; font-size: .9rem; }
  #season { min-width: 96px; }
  .acts-label { font-size: .8rem; color: var(--muted); margin: 6px 2px 0 0; }
  @media (max-width: 560px) { .side button { padding: 9px 12px; font-size: .85rem; } }
  body.in-cabin .side, body.in-cabin .controls { display: none; }
  #cabinUI { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 3; max-height: calc(100vh - 120px); overflow-y: auto; scrollbar-width: none; }
  #cabinUI[hidden], #seatPick[hidden] { display: none; }
  #cabinUI button { padding: 9px 15px; font-size: .9rem; }
  #cabinUI button[data-c=exit] { margin-top: 8px; }
  #seatPick { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; background: var(--bar-bg); backdrop-filter: blur(10px); border: 1.5px solid var(--ink); border-radius: 18px; padding: 18px 20px; max-width: calc(100vw - 32px); box-sizing: border-box; }
  .pick-title { margin: 0 0 12px; font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .pick-swatch { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink); flex: none; }
  .pick-grid { display: grid; grid-template-columns: 24px repeat(2, minmax(44px, 54px)) 16px repeat(2, minmax(44px, 54px)); gap: 5px; max-height: 52vh; overflow-y: auto; }
  .pick-grid button { padding: 8px 0; font-size: .85rem; border-radius: 9px; }
  .pick-grid button:disabled { opacity: .3; cursor: default; background: transparent; color: var(--ink); }
  .pick-head, .pick-row { font-size: .8rem; color: var(--muted); text-align: center; align-self: center; }
  .pick-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .pick-actions button { padding: 9px 15px; font-size: .9rem; }
  #cabFade { position: fixed; inset: 0; background: #0d1114; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 4; }
</style>
</head>
<body>
<div id="stage" aria-label="3D view of an airliner that transforms between a plane, a robot, a train and a rocket"></div>
<div id="countdown" aria-live="assertive"></div>
<div class="side">
  <button id="season" type="button" aria-label="Change the season">Summer</button>
  <button id="daynight" type="button" aria-label="Switch between day and night">Day</button>
  <button id="sound" type="button" aria-pressed="true">Sound on</button>
  <button id="park" type="button" aria-label="Put Skyrender away for the night">Put away</button>
  <div id="acts" role="group" aria-label="Things to try"></div>
</div>
<div class="bar">
  <div>
    <p class="name">Skyrender</p>
    <p class="step" id="step" aria-live="polite">Parked at the gate</p>
  </div>
  <div class="controls">
    <label class="scrub">Scrub <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Progress through the current transformation"></label>
    <div class="modes" role="group" aria-label="Mode">
      <button type="button" data-mode="0" aria-pressed="true">Plane</button>
      <button type="button" data-mode="1" aria-pressed="false">Robot</button>
      <button type="button" data-mode="2" aria-pressed="false">Train</button>
      <button type="button" data-mode="3" aria-pressed="false">Rocket</button>
      <button type="button" data-mode="4" aria-pressed="false">Truck</button>
      <button type="button" data-mode="5" aria-pressed="false">Tractor</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Skyrender rig. Every piece hangs off its parent by one hinge or one slide, so nothing ever detaches.
// Each joint stores a pose for every mode. A transformation between ANY two modes is planned on the
// fly from wherever the toy is right now: small accessories tuck away first, the big body sections
// hinge into place, then the new mode's accessories deploy.
const MODES = ['plane', 'robot', 'train', 'rocket', 'truck', 'tractor'];

function buildRig(THREE, tex) {
  const H = Math.PI / 2, PI = Math.PI;
  const DS = THREE.DoubleSide;
  const M = {
    white:  new THREE.MeshStandardMaterial({ color: 0xe8e7e2, roughness: 0.55, metalness: 0.1, side: DS }),
    grey:   new THREE.MeshStandardMaterial({ color: 0x9aa1a5, roughness: 0.6, metalness: 0.3 }),
    livery: new THREE.MeshStandardMaterial({ color: 0x7a2430, roughness: 0.55, metalness: 0.1, side: DS }),
    gun:    new THREE.MeshStandardMaterial({ color: 0x3a3e42, roughness: 0.7, metalness: 0.5, side: DS }),
    dark:   new THREE.MeshStandardMaterial({ color: 0x1c2024, roughness: 0.8, metalness: 0.3, side: DS }),
    glass:  new THREE.MeshStandardMaterial({ color: 0x1d2a33, roughness: 0.15, metalness: 0.5 }),
    tire:   new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.95 }),
    steel:  new THREE.MeshStandardMaterial({ color: 0x8d9196, roughness: 0.35, metalness: 0.8 }),
    brass:  new THREE.MeshStandardMaterial({ color: 0xc9a24a, roughness: 0.3, metalness: 0.85 }),
    iron:   new THREE.MeshStandardMaterial({ color: 0x23262a, roughness: 0.6, metalness: 0.4, side: DS }),
    coal:   new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.95, flatShading: true }),
    beacon: new THREE.MeshStandardMaterial({ color: 0x8a1a1a, emissive: 0xff2a1a, emissiveIntensity: 0.8 }),
    navR:   new THREE.MeshStandardMaterial({ color: 0x8a1a1a, emissive: 0xff2a1a, emissiveIntensity: 0.6 }),
    navG:   new THREE.MeshStandardMaterial({ color: 0x1a6a2a, emissive: 0x2aff5a, emissiveIntensity: 0.6 }),
    rubber: new THREE.MeshStandardMaterial({ color: 0x191919, roughness: 0.9 }),
    paint:  new THREE.MeshStandardMaterial({ color: 0x9c2b2b, roughness: 0.35, metalness: 0.2, side: DS }),
    wood:   new THREE.MeshStandardMaterial({ color: 0x8a6a45, roughness: 0.9 }),
    tail:   new THREE.MeshStandardMaterial({ color: 0x8a1a1a, emissive: 0xff2a1a, emissiveIntensity: 0.5 }),
    marker: new THREE.MeshStandardMaterial({ color: 0xc9821e, emissive: 0xffa21a, emissiveIntensity: 0.35 }),
    tape:   new THREE.MeshStandardMaterial({ color: 0xc8202e, roughness: 0.5 }),
    window: new THREE.MeshStandardMaterial({ color: 0xa9c4d2, roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.32, side: DS, depthWrite: false }),

    lamp:   new THREE.MeshStandardMaterial({ color: 0xf3d7a0, emissive: 0xe9b35f, emissiveIntensity: 0.6, roughness: 0.4 }),
    head:   new THREE.MeshStandardMaterial({ color: 0xf6f0dc, emissive: 0xfff3cf, emissiveIntensity: 0.15, roughness: 0.3 }),
    glow:   new THREE.MeshStandardMaterial({ color: 0x5a3a2a, emissive: 0xff7a2a, emissiveIntensity: 0.35, roughness: 0.5 }),
    visor:  new THREE.MeshStandardMaterial({ color: 0x5a1010, emissive: 0xff3326, emissiveIntensity: 0.1, roughness: 0.3 })
  };

  // ---------- geometry helpers ----------
  const box = (w, h, d, mat, x = 0, y = 0, z = 0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); return m;
  };
  const tube = (rF, rB, len, mat) => {                   // along Z, radius rF at +z
    const g = new THREE.CylinderGeometry(rF, rB, len, 28); g.rotateX(H);
    return new THREE.Mesh(g, mat);
  };
  const arc = (r, len, t0, t1, mat) => {                 // partial tube; angle 0 = belly, +H = right side
    const g = new THREE.CylinderGeometry(r, r, len, 24, 1, true, t0, t1 - t0); g.rotateX(H);
    return new THREE.Mesh(g, mat);
  };
  const decal = (map, w, h, pos, n, u) => {
    if (!map) return new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ map, transparent: true, roughness: 0.6, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    const N = new THREE.Vector3(...n).normalize(), U = new THREE.Vector3(...u).normalize();
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(new THREE.Vector3().crossVectors(U, N), U, N));
    m.position.set(...pos); return m;
  };
  // A slice of one big picture, so artwork can span many hinged panels and line up when they unfold
  const sliceDecal = (map, w, h, pos, n, u, u0, u1, v0, v1) => {
    if (!map) return new THREE.Group();
    const m = decal(map, w, h, pos, n, u);
    m.material.transparent = false; m.material.depthWrite = true;
    const uv = m.geometry.attributes.uv;
    uv.setXY(0, u0, v1); uv.setXY(1, u1, v1); uv.setXY(2, u0, v0); uv.setXY(3, u1, v0); uv.needsUpdate = true;
    return m;
  };
  // Half tube: side +1 = right half (x >= 0). Gunmetal inner plate and end caps show the "mechanism".
  const shell = (side, rF, rB, len, windows) => {
    const g = new THREE.Group();
    const cg = new THREE.CylinderGeometry(rF, rB, len, 20, 1, true, side > 0 ? 0 : PI, PI); cg.rotateX(H);
    g.add(new THREE.Mesh(cg, M.white));
    const pg = new THREE.BufferGeometry(), L = len / 2;
    pg.setAttribute('position', new THREE.Float32BufferAttribute([0, -rB, -L, 0, rB, -L, 0, rF, L, 0, -rB, -L, 0, rF, L, 0, -rF, L], 3));
    pg.computeVertexNormals(); g.add(new THREE.Mesh(pg, M.gun));
    for (const [r, z] of [[rF, L], [rB, -L]]) {
      const c = new THREE.Mesh(new THREE.CircleGeometry(r, 16, side > 0 ? -H : H, PI), M.gun); c.position.z = z; g.add(c);
    }
    const rMid = (rF + rB) / 2;
    g.add(box(0.03, 0.07, len * 0.96, M.livery, side * (rMid - 0.01), 0.04, 0));
    if (windows) for (let z = -L + 0.18; z < L - 0.1; z += 0.26) g.add(box(0.03, 0.09, 0.09, M.glass, side * (rMid - 0.015), 0.22, z));
    return g;
  };
  const wingGeo = (side, span, root, tip, sweep, thick) => {
    const s = new THREE.Shape();
    s.moveTo(0, root / 2); s.lineTo(side * span, root / 2 - sweep);
    s.lineTo(side * span, root / 2 - sweep - tip); s.lineTo(0, -root / 2); s.lineTo(0, root / 2);
    const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false });
    g.rotateX(H); g.translate(0, thick / 2, 0); return g;
  };
  const gear = (strut, wheelR, twin) => {
    const g = new THREE.Group();
    g.add(box(0.08, strut, 0.08, M.grey, 0, -strut / 2, 0));
    const wg = new THREE.CylinderGeometry(wheelR, wheelR, 0.14, 18); wg.rotateZ(H);
    for (const x of twin ? [-0.12, 0.12] : [0]) { const w = new THREE.Mesh(wg, M.tire); w.position.set(x, -strut, 0); g.add(w); }
    return g;
  };
  const passenger = (shirt, skin, hair, pants) => {
    const g = new THREE.Group();
    const S = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });
    const sh = S(shirt), sk = S(skin), ha = S(hair), pa = S(pants);
    g.add(box(0.18, 0.04, 0.2, M.gun, 0, -0.02, 0), box(0.18, 0.32, 0.04, M.gun, 0, 0.14, -0.1));
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.18, 12), sh).translateY(0.11));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.065, 14, 10), sk).translateY(0.27));
    const hr = new THREE.Mesh(new THREE.SphereGeometry(0.069, 14, 8, 0, PI * 2, 0, 1.4), ha); hr.position.y = 0.285; g.add(hr);
    g.add(box(0.02, 0.02, 0.01, M.dark, -0.025, 0.28, 0.062), box(0.02, 0.02, 0.01, M.dark, 0.025, 0.28, 0.062));
    g.add(box(0.12, 0.05, 0.15, pa, 0, 0.03, 0.07), box(0.12, 0.13, 0.05, pa, 0, -0.03, 0.14));
    g.add(box(0.035, 0.13, 0.04, sh, 0.085, 0.12, 0.03), box(0.035, 0.13, 0.04, sh, -0.085, 0.12, 0.03));
    return g;
  };
  // Rocket exhaust: additive cones pointing -z. Hidden until ignition.
  const flames = [];
  const fOuter = new THREE.MeshBasicMaterial({ color: 0xff6a1a, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
  const fInner = new THREE.MeshBasicMaterial({ color: 0xfff1b8, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
  const flame = (r, len) => {
    const g = new THREE.Group();
    for (const [rr, ll, mat] of [[r, len, fOuter], [r * 0.55, len * 0.6, fInner]]) {
      const c = new THREE.ConeGeometry(rr, ll, 18, 1, true); c.rotateX(-H); c.translate(0, 0, -ll / 2);
      g.add(new THREE.Mesh(c, mat));
    }
    g.visible = false; flames.push(g); return g;
  };
  // Rail wheel truck: two flanged steel wheels in a side frame. Origin = truck center.
  const wheels = [];
  const truck = side => {
    const g = new THREE.Group();
    const wg = new THREE.CylinderGeometry(0.22, 0.22, 0.08, 22); wg.rotateZ(H);
    const fg = new THREE.CylinderGeometry(0.25, 0.25, 0.025, 22); fg.rotateZ(H);
    for (const z of [-0.28, 0.28]) {
      const w = new THREE.Group(); w.position.set(0, 0, z);
      w.add(new THREE.Mesh(wg, M.steel));
      const flange = new THREE.Mesh(fg, M.steel); flange.position.x = -side * 0.05; w.add(flange);   // flange on the inside
      for (let k = 0; k < 3; k++) { const sp = box(0.09, 0.3, 0.04, M.gun); sp.rotation.x = k * PI / 3; w.add(sp); }
      g.add(w); wheels.push(w);
    }
    g.add(box(0.05, 0.16, 0.9, M.gun, side * 0.07, 0.04, 0));          // side frame
    g.add(box(0.06, 0.04, 0.5, M.livery, side * 0.1, 0.1, 0));
    g.add(box(0.1, 0.12, 0.16, M.dark, side * 0.07, 0.17, 0));          // spring box
    return g;
  };

  // ---------- joint system ----------
  // J(parent, pivot, spec). spec.plane / .robot / .train / .rocket = { p: slide from pivot, r: euler };
  // anything left out falls back to the plane pose. kind: 'body' moves in the middle of a morph,
  // 'acc' tucks into spec.stow first and deploys last, 'pulse' opens only while spec.pulse moves.
  // ord sets the order parts move in; say[mode] / stowSay are the on-screen captions.
  const joints = [];
  const mk = (pv, q) => ({ P: [pv[0] + q.p[0], pv[1] + q.p[1], pv[2] + q.p[2]], R: q.r.slice(), S: q.S.slice() });
  const J = (parent, pivot, spec = {}) => {
    const g = new THREE.Group();
    if (spec.order) g.rotation.order = spec.order;
    const base = { p: (spec.plane && spec.plane.p) || [0, 0, 0], r: (spec.plane && spec.plane.r) || [0, 0, 0], S: (spec.plane && spec.plane.S) || [1, 1, 1] };
    const full = q => mk(pivot, { p: (q && q.p) || base.p, r: (q && q.r) || base.r, S: (q && q.S) || base.S });
    g.userData = {
      poses: MODES.map(m => full(spec[m])),
      stow: spec.stow ? full(spec.stow) : full(base),
      open: spec.open ? full(spec.open) : null,
      kind: spec.kind || 'body', ord: spec.ord ?? 5, pulse: spec.pulse || null,
      say: spec.say || {}, stowSay: spec.stowSay || null
    };
    const p0 = g.userData.poses[0];
    g.position.set(...p0.P); g.rotation.set(...p0.R); g.scale.set(...p0.S);
    parent.add(g); joints.push(g);
    return g;
  };

  // Telescoping rail truck: a hanger slides down, then the wheel truck slides down out of it.
  const railTruck = (parent, s, pivot, label, trailer) => {
    const tk = trailer ? { truck: { p: [0, -0.75, 0] } } : {};
    const hg = J(parent, pivot, { kind: 'acc', ord: 1, train: { p: [0, -0.6, 0] }, ...tk, say: { train: label, truck: trailer && s > 0 ? 'Rail wheels drop down as the trailer bogies' : null } });
    hg.add(box(0.08, 0.5, 0.3, M.gun), box(0.09, 0.06, 0.32, M.livery, 0, -0.2, 0));
    const t = J(hg, [0, 0, 0], { kind: 'acc', ord: 1, train: { p: [0, -0.57, 0] }, ...(trailer ? { truck: { p: [0, -0.68, 0] } } : {}) });
    t.add(truck(s));
  };

  // Big steam driving wheel: steel tire, red spoked center, counterweight and crank pin.
  const drivers = [];
  const driverWheel = (side, phase) => {
    const w = new THREE.Group();
    const tire = new THREE.CylinderGeometry(0.4, 0.4, 0.09, 30); tire.rotateZ(H);
    w.add(new THREE.Mesh(tire, M.steel));
    const fl = new THREE.CylinderGeometry(0.43, 0.43, 0.02, 30); fl.rotateZ(H);
    const flange = new THREE.Mesh(fl, M.steel); flange.position.x = -side * 0.04; w.add(flange);
    const ctr = new THREE.CylinderGeometry(0.34, 0.34, 0.1, 30); ctr.rotateZ(H);
    w.add(new THREE.Mesh(ctr, M.livery));
    for (let k = 0; k < 10; k++) { const sp = box(0.03, 0.62, 0.035, M.iron, side * 0.055); sp.rotation.x = k * PI / 10; w.add(sp); }
    const hub = new THREE.CylinderGeometry(0.08, 0.08, 0.14, 16); hub.rotateZ(H); w.add(new THREE.Mesh(hub, M.iron));
    const cw = box(0.03, 0.12, 0.3, M.iron, side * 0.06, -0.22, 0); w.add(cw);                    // counterweight
    const pin = new THREE.CylinderGeometry(0.035, 0.035, 0.12, 10); pin.rotateZ(H);
    const p = new THREE.Mesh(pin, M.brass); p.position.set(side * 0.08, 0.2, 0); w.add(p);         // crank pin
    drivers.push({ w, phase });
    return w;
  };
  // Tractor tires: fat knobby rubber folded flat around the hub, they pump up around the red wheels
  const tractorTire = (parent, s, R, tube, label) => {
    const t = J(parent, [0, 0, 0], { kind: 'acc', ord: 1.2, plane: { S: [0.6, 0.06, 0.06] }, tractor: { S: [1, 1, 1] }, say: { tractor: label } });
    const g = new THREE.TorusGeometry(R, tube, 12, 36); g.rotateY(H);
    t.add(new THREE.Mesh(g, M.rubber));
    for (let k = 0; k < 18; k++) {                                                  // chevron tread lugs

// ---------- morph planner ----------
// Build a plan from the current pose of every joint to `to` (a mode index).
function planMorph(rig, to, fromMode) {
  const EPS = 1e-4;
  const eq = (a, b) => a.P.every((v, i) => Math.abs(v - b.P[i]) < EPS) && a.R.every((v, i) => Math.abs(v - b.R[i]) < EPS) && a.S.every((v, i) => Math.abs(v - b.S[i]) < EPS);
  const copy = p => ({ P: p.P.slice(), R: p.R.slice(), S: p.S.slice() });
  const from = rig.cur.map(copy);
  const target = MODES[to];
  const A = [], B = [], C = [];
  rig.joints.forEach((j, i) => {
    const u = j.userData;
    if (u.kind === 'pulse') return;
    const cur = from[i], tgt = u.poses[to];
    if (eq(cur, tgt)) return;
    if (u.kind === 'acc') {
      if (!eq(cur, u.stow)) A.push({ i, a: cur, b: u.stow, ord: u.ord, label: u.stowSay });
      if (!eq(u.stow, tgt)) C.push({ i, a: u.stow, b: tgt, ord: u.ord, label: u.say[target] });
    } else B.push({ i, a: cur, b: tgt, ord: u.ord, label: u.say[target] });
  });
  // Parts sharing an `ord` move together; groups follow one another with overlap.
  const stagger = (list, t0, desc, per) => {
    if (!list.length) return t0;
    const ords = [...new Set(list.map(s => s.ord))].sort((x, y) => desc ? y - x : x - y);
    const G = ords.length, len = 0.8 + Math.min(per * G, 6.5);
    const d = Math.min(1, Math.max(0.3, 1.8 / G));
    for (const s of list) {
      const k = ords.indexOf(s.ord);
      const st = G === 1 ? 0 : k / (G - 1) * (1 - d);
      s.t0 = t0 + st * len; s.t1 = s.t0 + d * len;
    }
    return t0 + len;
  };
  // Leaving robot mode undoes the robot unfold in reverse order.
  const reverse = to !== 1 && (fromMode === 1 || fromMode == null);
  const OV = 0.5;
  const endA = stagger(A, 0, true, 0.4);
  const startB = A.length ? endA - OV : 0;
  const endB = stagger(B, startB, reverse, 0.6);
  const startC = B.length ? endB - OV : Math.max(0, startB);
  const endC = stagger(C, startC, false, 0.4);
  const segs = rig.joints.map(() => []);
  for (const s of [...A, ...B, ...C]) segs[s.i].push(s);
  // Pulse doors open just before their part moves and close right after.
  rig.joints.forEach((j, i) => {
    const u = j.userData;
    if (u.kind !== 'pulse') return;
    const ref = segs[rig.joints.indexOf(u.pulse)];
    const closed = u.poses[0];
    let last = from[i];
    for (const r of ref) {
      segs[i].push({ a: last, b: u.open, t0: Math.max(0, r.t0 - 0.4), t1: r.t0 + 0.05 });
      segs[i].push({ a: u.open, b: closed, t0: r.t1, t1: r.t1 + 0.4 });
      last = closed;
    }
    if (!ref.length && !eq(last, closed)) segs[i].push({ a: last, b: closed, t0: 0, t1: 0.4 });
  });
  for (const list of segs) list.sort((x, y) => x.t0 - y.t0);
  const T = Math.max(endA, endB, endC, ...segs.flat().map(s => s.t1), 0.01);
  const steps = [...A, ...B, ...C].filter(s => s.label).map(s => ({ at: s.t0, label: s.label })).sort((x, y) => x.at - y.at);
  return { to, from, segs, steps, T };
}

// Pose every joint at time t (seconds) into a plan.
function poseRig(rig, plan, t, ease) {
  const c01 = x => Math.min(1, Math.max(0, x));
  rig.joints.forEach((j, i) => {
    let v = plan.from[i];
    for (const s of plan.segs[i]) {
      if (t <= s.t0) break;
      const k = ease(c01((t - s.t0) / (s.t1 - s.t0)));
      v = {
        P: s.a.P.map((x, n) => x + (s.b.P[n] - x) * k),
        R: s.a.R.map((x, n) => x + (s.b.R[n] - x) * k),

      const fx = f.cx + Math.cos(f.a) * f.r, fz = f.cz + Math.sin(f.a) * f.r, fy = f.cy * (1 - air) + air * (8 + Math.sin(f.a * 2) * 3);
      const heading = Math.atan2(-Math.sin(f.a) * f.w, Math.cos(f.a) * f.w);
      for (const b of f.birds) {
        const o = b.userData.off, c = Math.cos(heading), s = Math.sin(heading);
        b.position.set(fx + o[0] * c + o[2] * s, fy + o[1], fz - o[0] * s + o[2] * c);
        b.rotation.y = heading;
        const flap = Math.sin(clockT * 9 + b.userData.ph) * 0.65;
        b.userData.L.rotation.z = flap; b.userData.R.rotation.z = -flap;
      }
    }

    // Sky fades to black, stars, Earth and the other planets come up
    nightK += ((night ? 1 : 0) - nightK) * Math.min(1, dt * 1.5);
    applyNight(ease(clamp01(nightK)), sp);
    sky.material.uniforms.top.value.copy(skyTopNow).lerp(spaceTop, sp);
    sky.material.uniforms.bottom.value.copy(skyBotNow).lerp(spaceBot, sp);
    scene.fog.color.copy(fog0).lerp(NIGHT.bot, ease(clamp01(nightK))).lerp(spaceBot, sp);
    scene.fog.near = 45 - 20 * air;                    // the ground fades into haze as the plane climbs
    scene.fog.far = 170 - 95 * air + sp * 3000;
    starMat.opacity = Math.max(sp, 0.85 * ease(clamp01(nightK)));
    space.visible = sp > 0;
    earthMat.opacity = sp; atmoMat.opacity = 0.35 * sp; moonMat.opacity = sp;
    for (const m of planetMats) m.opacity = sp;
    earth.rotation.y += dt * 0.02; giant.rotation.y += dt * 0.03;

    // Engines: countdown -> ignition -> full burn -> gentle cruise in orbit
    const counting = onPad && launchT < 3;
    if (onPad) thrust = launchT < 3 ? 0 : launchT < 4.5 ? (launchT - 3) / 1.5 : sp >= 1 ? Math.max(0.35, thrust - dt * 0.5) : 1;
    else thrust = pending !== null && plan.to === 3 ? 0.6 : parkMoving && plan.to === 3 ? 0.3 : 0;
    const flick = reduceMotion ? 1 : 0.85 + Math.random() * 0.3;
    for (const f of rig.flames) {
      f.visible = thrust > 0.01;
      const w = 0.5 + 0.5 * thrust;
      f.scale.set(w * flick, w * flick, thrust * flick * (launchT > 4.5 ? 1.25 : 1));
    }
    rig.M.glow.emissiveIntensity = 0.35 + 2.5 * thrust + 0.6 * planeSpeed / 28;
    const lampOn = (env.track > 0.5 && !on.lamp) || ((plan.to === 4 || plan.to === 5) && on.lights && !on.wreck);
    rig.M.marker.emissiveIntensity = (plan.to === 4 || plan.to === 5) && on.lights ? (on.wreck ? (Math.sin(clockT * 8) > 0 ? 2.5 : 0.1) : 1.8) : 0.35;   // hazards blink after a crash
    rig.M.tail.emissiveIntensity = plan.to === 4 && on.lights ? 1.6 : 0.5;
    rig.M.head.emissiveIntensity = lampOn ? 2.2 : 0;
    rig.M.head.color.setHex(lampOn ? 0xfff6dc : 0x6e6c66);             // an unlit lens is dull grey, not white
    const nk = ease(clamp01(nightK));
    beam.intensity += ((lampOn ? 3.2 * nk : 0) - beam.intensity) * Math.min(1, dt * 6);
    const strobe = plan.to === 0 && on.lights && Math.sin(clockT * 12) > 0.6;
    rig.M.navR.emissiveIntensity = rig.M.navG.emissiveIntensity = strobe ? 3 : 0.6;
    rig.M.beacon.emissiveIntensity = plan.to === 0 && on.lights ? (Math.sin(clockT * 7) > 0 ? 2.5 : 0.2) : 0.8;
    const cd = counting ? String(3 - Math.floor(launchT)) : (onPad && launchT < 5.5 && launchT >= 3 ? 'Blast off!' : '');
    if (countdown.textContent !== cd) { if (cd) sfx.beep(cd === 'Blast off!'); countdown.textContent = cd; }

    // Launch smoke billows at ignition and stays on the pad as it climbs away
    const puffK = plan.to === 3 && (onPad || pending !== null) ? clamp01((launchT - 3) / 3) : 0;
    smokeMat.opacity = 0.75 * puffK * (1 - clamp01((launchT - 10) / 6));
    for (const m of smoke) {
      m.visible = puffK > 0;
      const d = m.userData.d + puffK * 7;
      m.position.set(Math.cos(m.userData.a) * d, 0.6 + puffK * 1.2, Math.sin(m.userData.a) * d);
      m.scale.setScalar(m.userData.s * (0.4 + puffK * 2.2));
    }

    // ---- set it down: lowest part rests on the ground, or wheel treads on the rail tops ----
    flyer.position.set(0, 0, 0); flyer.rotation.set(0, 0, 0);
    rig.bot.position.y = 0;
    flyer.updateMatrixWorld(true);                           // measure with the flight group back at the origin
    box.copy(exactBox(THREE, rig.bot, skipBox)); box.getCenter(center);
    if ((blend.wreck || 0) > 0.001) { rig.bot.position.y = snapY; center.y += snapY; }   // wrecked pieces settle on the road
    else { rig.bot.position.y = snapY = -box.min.y - 0.03 * env.track; center.y -= box.min.y; }      // flanges dip just inside the rails
    beam.position.set(0, 1.1, box.max.z - 0.3); beam.target.position.set(0, 0, box.max.z + 9);

    const rumble = reduceMotion ? 0 : Math.min(1, trainSpeed / 8 + (air < 0.05 ? planeSpeed / 28 : 0));
    const pitch = plan.to === 0 ? -0.13 * Math.sin(Math.PI * clamp01((planeT - PLANE_LIFT + 0.8) / 6)) : 0;   // nose up at liftoff
    flyer.position.y = air * (8 + Math.sin(clockT * 0.9) * 0.25) + Math.abs(Math.sin(clockT * 11)) * 0.012 * rumble;
    flyer.rotation.z = air * Math.sin(clockT * 0.45) * 0.05 + Math.sin(clockT * 9) * 0.002 * rumble;
    flyer.rotation.x = pitch + air * Math.sin(clockT * 0.7) * 0.02;
    const shake = reduceMotion || !onPad ? 0 : thrust * (1 - sp) * 0.06;
    flyer.position.x = (Math.random() - 0.5) * shake; flyer.position.z = (Math.random() - 0.5) * shake;
    // In orbit the rocket turns slowly and steadily
    if (plan.to === 3 && settled() && sp > 0 && !reduceMotion) orbitRoll += sp * dt * 0.12; else if (launchT === 0) orbitRoll = 0;
    flyer.rotation.y = orbitRoll + veer.yaw; flyer.position.x += veer.x; flyer.position.z += parkZ + hallZ;
    if (stompK > 0) { stompK = Math.max(0, stompK - dt * 6); if (!reduceMotion) flyer.position.y -= Math.sin(Math.min(1, stompK) * Math.PI) * 0.025 * stompK; }
    if (hop > 0) { hop = Math.max(0, hop - dt * 1.8); flyer.position.y += Math.abs(Math.sin(hop * Math.PI * 3)) * 0.18 * hop; }
    center.y += flyer.position.y;

    // Petals, leaves or snow drift down around the toy (not up in the sky)
    fallers.visible = fallActive > 0 && air < 0.3 && alt < 30;
    if (fallers.visible) {
      fallers.position.set(target3.x, 0, target3.z);
      const sway = season === 'Winter' ? 0.25 : 0.9;
      for (let i = 0; i < fallActive; i++) {
        let y = fallPos[i * 3 + 1] - fallSpeed * dt * (0.7 + (fallSeed[i] % 1) * 0.6);
        if (y < 0) y += 22;
        fallPos[i * 3 + 1] = y;
        fallPos[i * 3] += Math.sin(clockT * 1.3 + fallSeed[i]) * sway * dt;
        fallPos[i * 3 + 2] -= groundSpeed * sdt;              // blow past when moving
        if (fallPos[i * 3 + 2] < -25) fallPos[i * 3 + 2] += 50;
      }
      fallGeo.attributes.position.needsUpdate = true;
    }
    sky.position.copy(camera.position);

    // Steam: gentle puffs at the station, faster chuffs as the train speeds up
    const steamy = env.track > 0.99 && plan.to === 2;
    puffClock += sdt;
    if (steamy && puffClock >= puffNext) { emitPuff(trainSpeed < 1); if (trainSpeed > 0.5) sfx.chuff(Math.min(1, trainSpeed / 6)); puffClock = 0; puffNext = trainSpeed > 0.5 ? Math.max(0.12, 1.4 / (trainSpeed / 0.4) * Math.PI) : 0.9; }
    // Big rig: black smoke chugs out of the chrome stacks
    if (plan.to === 4 && settled() && on.smoke && !on.wreck && rig.truckBits.stacks) {
      smokeClock += sdt;
      if (smokeClock > 0.1) { smokeClock = 0; const st = rig.truckBits.stacks[Math.random() < 0.5 ? 0 : 1]; emitPuff(0.45 + Math.random() * 0.25, st, 0x3b3b3d); }
    }
    for (const p of puffs) {
      if (p.life <= 0) continue;
      p.life -= sdt * 0.42;
      p.m.position.y += sdt * (1.1 + 0.4 * p.big);
      p.m.position.z -= sdt * (trainSpeed * 0.95 + truckSpeed * 0.95 + tractorSpeed * 0.95 + 0.4);
      p.m.position.x += sdt * 0.15;
      const age = 1 - p.life;
      p.m.scale.setScalar((0.22 + age * 1.3) * p.big);
      p.m.material.opacity = 0.85 * Math.min(1, age * 6) * Math.max(0, p.life);
      if (p.life <= 0) p.m.visible = false;
    }

    for (const f of rig.fans) f.rotation.z += dt * (5 + 14 * planeSpeed / 28 + 10 * air);
    if (rumbleGain && soundOn) {                         // rocket roar, jet whoosh, truck engine
      const roar = thrust * (1 - 0.7 * sp), jet = plan.to === 0 ? 0.25 * Math.min(1, planeSpeed / 28 + air) : 0, eng = 0.18 * truckSpeed / 10;
      rumbleGain.gain.setTargetAtTime(cab.active ? 0.1 + 0.35 * (cab.engine || 0) : Math.min(0.9, roar * 0.8 + jet + eng), actx.currentTime, 0.15);
      rumbleFilter.frequency.setTargetAtTime(roar > 0.05 ? 260 + 300 * roar : jet > 0.05 ? 900 : 140, actx.currentTime, 0.2);
    }
    const text = caption();
    if (stepLabel.textContent !== text) { stepLabel.textContent = text; if (!settled() && pending === null) sfx.click(); }

    target3.lerp(center, 1 - Math.exp(-dt * 3));
    if (viewK > 0.001) { const vk = sm(viewK); target3.x += (0 - target3.x) * vk; target3.z += (hall.Z + hall.D * 0.4 - target3.z) * vk; target3.y += (1.5 - target3.y) * vk; }
    if (homeK > 0) { const dk = sm(homeK); target3.x += (0 - target3.x) * dk * 0.6; target3.z += (home.GZ - 2 - target3.z) * dk * 0.6; target3.y += (5 - target3.y) * dk * 0.5; }
    if (sp > 0 || air > 0) target3.y = center.y;
    // Pull back for tall poses (the rocket on the pad) so the whole toy stays in frame
    const tallest = box.max.y - box.min.y;
    const span = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
    const want = Math.max(1, 0.7 * tallest / Math.tan(camera.fov * Math.PI / 360) / 17, span / 11, 1 + 1.0 * sm(homeK)) * (1 - sm(viewK)) + 1.7 * sm(viewK);
    fitScale += (want - fitScale) * (1 - Math.exp(-dt * 2));
    idle += dt;
    if (!dragging && idle > 2 && !reduceMotion && homeK < 0.01) theta += dt * (0.1 - 0.06 * viewK);
    if (viewK > 0.01 && !dragging) phi += (0.78 - phi) * Math.min(1, dt * 1.2) * viewK;   // look down into the airport
    if (homeK > 0.01 && !dragging) {                    // at bedtime, swing around to look at the front door
      const want = Math.PI - 0.55; let d = ((want - theta) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
      theta += d * Math.min(1, dt * 1.6) * homeK;
      phi += (1.12 - phi) * Math.min(1, dt * 1.2) * homeK;
    }
    const rr = radius * fitScale;
    const ph = phi + (1.42 - phi) * sp;                // in orbit, look out toward the horizon and the planets
    camera.position.set(
      target3.x + rr * Math.sin(ph) * Math.sin(theta),
      target3.y + rr * Math.cos(ph),
      target3.z + rr * Math.sin(ph) * Math.cos(theta));
    camera.lookAt(target3);
    if (cab.active) { updateCabin(dt); renderer.render(cabinScene, cabinCam); } else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  setButtons();
  frame();
})();
</script>
</body>
</html>
